# NOTE: no Vector/QAngle queries - public/mathlib/vector.h here contains
# no virtual methods, so these classes have no vtable and the analyzer
# rejects a wildcard query ("invalid vtable address point").

# NOTE: no CBaseHandle query - public/basehandle.h here declares no virtual
# methods, so CBaseHandle has no vtable (only CHandle<T>/IHandleEntity do).

# NOTE: no CHandle<T> query - this checkout's CHandle (public/ihandleentity.h)
# declares no virtual methods (only IHandleEntity does), and template names
# never match the analyzer's class-name lookup anyway. CHandle churn reuses
# IHandleEntity's three slots, which the next query covers.

[[class]]
header = "public/ihandleentity.h"
name = "IHandleEntity"
methods = ["*"]

