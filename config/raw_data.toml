[root]
path = "extern/source/source-sdk-2013/src"

# Top-level constants used by the runtime's engine and plugin version
# probing. These queries keep the values in the generated indexes instead of
# relying on the previous hand-maintained constants.
[[const]]
header = "public/eiface.h"
names = [
    "VENGINE_SERVER_RANDOM_INTERFACE_VERSION",
    "INTERFACEVERSION_SERVERGAMEENTS",
    "INTERFACEVERSION_SERVERGAMECLIENTS_VERSION_3",
    "INTERFACEVERSION_SERVERGAMECLIENTS",
    "INTERFACEVERSION_SERVERGAMECLIENTS_VERSION_4",
    "INTERFACEVERSION_UPLOADGAMESTATS",
    "SERVER_DLL_SHARED_APPSYSTEMS",
    "INTERFACEVERSION_SERVERGAMETAGS",
    "INTERFACEVERSION_PLUGINHELPERSCHECK",
    "INTERFACEVERSION_SERVERGAMEDLL_VERSION_9",
    "INTERFACEVERSION_SERVERGAMEDLL_VERSION_8",
    "INTERFACEVERSION_SERVERGAMEDLL",
    "INTERFACEVERSION_SERVERGAMEDLL_VERSION_11",
    "INTERFACEVERSION_SERVERGAMEDLL_VERSION_10",
    "INTERFACEVERSION_SERVERGAMEDLL_INT",
    "INTERFACEVERSION_VENGINESERVER_VERSION_22",
    "INTERFACEVERSION_VENGINESERVER",
    "INTERFACEVERSION_VENGINESERVER_INT",
    "INTERFACEVERSION_VENGINESERVER_VERSION_21",
]

[[const]]
header = "public/icvar.h"
names = [
    "CVAR_QUERY_INTERFACE_VERSION",
    "CVAR_INTERFACE_VERSION",
]

[[const]]
header = "public/engine/iserverplugin.h"
names = [
    "INTERFACEVERSION_ISERVERPLUGINHELPERS",
    "INTERFACEVERSION_ISERVERPLUGINCALLBACKS",
    "InvalidQueryCvarCookie",
    "INTERFACEVERSION_ISERVERPLUGINCALLBACKS_VERSION_1",
    "INTERFACEVERSION_ISERVERPLUGINCALLBACKS_VERSION_2",
]

